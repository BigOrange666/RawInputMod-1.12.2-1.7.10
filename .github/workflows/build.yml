name: Build RawInput Mod

on:
  push:
    branches: [ "test", "1.7.10" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "test", "1.7.10" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Setup Minecraft workspace
      run: |
        ./gradlew setupDecompWorkspace --no-daemon
        
    - name: Build with Gradle
      run: |
        ./gradlew build --no-daemon
        
    - name: List build artifacts
      run: |
        echo "Build artifacts:"
        ls -la build/libs/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rawinput-mod-artifacts
        path: build/libs/*.jar
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        name: Release ${{ github.ref_name }}
        body: |
          Automated release of RawInput Mod for Minecraft 1.7.10
          
          ## Java 17+ Compatibility
          This version includes full compatibility with Java 17+ while maintaining backward compatibility with Java 8.
          
          ## Required JVM Arguments for Java 17+
          ```
          --add-opens java.base/java.lang=ALL-UNNAMED
          --add-opens java.base/java.lang.reflect=ALL-UNNAMED
          --add-opens java.base/java.util=ALL-UNNAMED
          --add-opens java.desktop/sun.awt=ALL-UNNAMED
          --add-opens java.desktop/sun.java2d=ALL-UNNAMED
          --add-exports java.base/sun.nio.ch=ALL-UNNAMED
          --add-exports jdk.unsupported/sun.misc=ALL-UNNAMED
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}