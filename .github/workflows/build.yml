name: Build RawInput Mod

on:
  push:
    branches: [ "test", "1.7.10" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "test", "1.7.10" ]
  workflow_dispatch:

jobs:
  build-source-jar:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        
    - name: Create source jar
      run: |
        mkdir -p build/libs
        cd src
        jar -cf ../build/libs/RawInput-1.7.10-1.4.3-sources.jar .
        cd ..
        
    - name: List build artifacts
      run: |
        echo "Build artifacts:"
        ls -la build/libs/
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rawinput-mod-sources
        path: build/libs/*.jar
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        name: Release ${{ github.ref_name }}
        body: |
          Source release of RawInput Mod for Minecraft 1.7.10
          
          ## Java 17+ Compatibility
          This version includes full compatibility with Java 17+ while maintaining backward compatibility with Java 8.
          
          ## Important Note
          This is a source jar file. To compile a runnable mod jar, you need:
          1. Proper Minecraft Forge development environment
          2. All Minecraft and Forge dependencies
          3. Correct compilation with the full ForgeGradle setup
          
          ## Required JVM Arguments for Java 17+
          ```
          --add-opens java.base/java.lang=ALL-UNNAMED
          --add-opens java.base/java.lang.reflect=ALL-UNNAMED
          --add-opens java.base/java.util=ALL-UNNAMED
          --add-opens java.desktop/sun.awt=ALL-UNNAMED
          --add-opens java.desktop/sun.java2d=ALL-UNNAMED
          --add-exports java.base/sun.nio.ch=ALL-UNNAMED
          --add-exports jdk.unsupported/sun.misc=ALL-UNNAMED
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}